    /* ---------------- RED THUNDER BORDER (NXT LEVEL) ----------------
       Dono black borders ke beech ke band me canvas lightning:

    function startLightning(hud, layer) {
      const canvas = el('canvas', { className: 'spark-canvas' });
      layer.append(canvas);
      const ctx = canvas.getContext('2d');
      const DPR = 1; /* border band patla hai — DPR 1 pe bhi crisp dikhta hai, 4x kam pixels = no lag */
      let W = 0, H = 0, P = 0;

        if (d < w) return [BAND + d, BAND];
        d -= w; if (d < h) return [W - BAND, BAND + d];
        d -= h; if (d < w) return [W - BAND - d, H - BAND];

      function boltPts(s, len) {

        const cx = W / 2, cy = H / 2;
        for (let t = 0; t <= len; t += 5) {
          const p = pAt(s + t);
          const dx = cx - p[0], dy = cy - p[1];
          const m = Math.hypot(dx, dy) || 1;
          const pull = Math.random() * 4.5; /* band ke andar hi rahna chahiye */
          pts.push([p[0] + (dx / m) * pull + (Math.random() - .5) * 3,

        }
        return pts;
      }
  
      const bolts = [];
      function spawnBolt() {
        bolts.push({ s: Math.random() * P, len: 45 + Math.random() * 90, sp: 7 + Math.random() * 9, forkT: 0, life: 0 });
      }
  
      function surge() {
        const s0 = Math.random() * P;
        const len = 50 + Math.random() * 70;
        strokePath(boltPts(s0, len), .95, 5);
        const p = pAt(s0 + Math.random() * len);
        const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 22);
        g.addColorStop(0, 'rgba(255,120,90,.85)');

        requestAnimationFrame(frame);

              const pts = [[p[0], p[1]]];
              for (let t = 4; t <= fl; t += 4) {

                          p[1] + (cy - p[1]) / m * t + (Math.random() - .5) * 5]);
              }
              strokePath(pts, .8, 1.6);

        }
        if (bolts.length > 7) bolts.splice(0, bolts.length - 7);
      })(last);
    }
  
    /* ---------------- STORM CANVAS ---------------- */
    function startStorm(hud, canvas) {
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, flash = 0;
      const bolts = [];
      const drops = [];
  
      function resize() {
        /* FIX: HUD hidden ho (display:none) toh offsetWidth=0 aata hai.

          const flick = (b.life > .75 && Math.random() < .4) ? .35 : 1;
          const a = Math.max(0, b.life) * flick;

      const PALETTE = ['#3A0000', '#4A0000', '#5C0000', '#6E0000', '#8B0000', '#A80000', '#C40000', '#E01515', '#FF2626'];

        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = (strong ? 1.5 : 1) * (0.8 + Math.random() * 3.4);
          parts.push({
            x: x + (Math.random() - .5) * 4,
            y: y + (Math.random() - .5) * 4,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 0.7,
            r: 1 + Math.random() * 2.4,
            life: 1,
            decay: 0.016 + Math.random() * 0.024,
            col: PALETTE[(Math.random() * PALETTE.length) | 0],
            grav: 0.05
          });
        }
        if (parts.length > 340) parts.splice(0, parts.length - 340);

      window.addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 24, true), { passive: true });

        if (!dragArmed) return;
        if (dragging) {
          hud.style.left = `${curLeft}px`;
          hud.style.top = `${curTop}px`;
          hud.style.transform = '';
          hud.classList.remove('is-dragging');
        }
        dragArmed = false; dragging = false;
      };
      /* Bind to WHOLE panel — not just header */
      hud.addEventListener('mousedown', startDrag);
      hud.addEventListener('touchstart', startDrag, { passive: true });
      /* keep header bindings too as a safe redundancy (no-op if hud already handled) */
      header.addEventListener('mousedown', startDrag);
      header.addEventListener('touchstart', startDrag, { passive: true });
      document.addEventListener('mousemove', moveDrag);
      document.addEventListener('touchmove', moveDrag, { passive: false });
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
      document.addEventListener('touchcancel', stopDrag);
  
      const poll = async () => {
        /* MANUAL MODE: auto prediction show NAHI hoga — sirf latest issue
           silently track hota hai taaki START dabane pe fresh result aaye */
        if (getPageKey() !== 'prediction') return;
        try {
          const result = await fetchLatest();
          const resultIssue = result && String(result.issueNumber ?? result.issue ?? result.period ?? result.gameNo ?? '').trim();
          if (resultIssue && resultIssue !== lastIssue) lastIssue = resultIssue;
          if (result) updateApiPage([result]);
          updateLivePeriodText(); /* latest completed period from API */
        } catch (error) { console.warn('[Marco HUD] background fetch failed:', error.message); }
      };
      poll();
      setInterval(poll, CONFIG.pollMs);
    }
  

    (function setupMoonIframe(){
      const frame=document.getElementById('moonBgIframe'); if(!frame) return;
      const fit=()=>{const v=window.visualViewport;frame.style.width=(v?v.width:innerWidth)+'px';frame.style.height=(v?v.height:innerHeight)+'px';};
      const tune=()=>{try{const d=frame.contentDocument;if(d&&d.body){d.body.style.margin='0';d.body.style.overflowX='hidden';d.body.style.touchAction='pan-x pan-y pinch-zoom';}}catch(e){}};
      fit(); tune(); frame.addEventListener('load',tune,{passive:true}); addEventListener('resize',fit,{passive:true}); addEventListener('orientationchange',()=>setTimeout(fit,150),{passive:true}); if(window.visualViewport) visualViewport.addEventListener('resize',fit,{passive:true});
    })();
    const start = () => createHud();
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
    else start();
  })();
  </script>
